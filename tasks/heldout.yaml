# HELD-OUT TASKS — never shown to Medic during diagnosis or patching.
#
# The point of these is that Medic's patch must generalise. If a fix only works
# on the train task, the patch overfitted to one question and the demo is a lie.
# Each bug gets 2-3 held-out tasks drawn from the SAME fixture corpus but
# DIFFERENT pages, so the fix cannot be memorised.

id: loop-solar
bug: loop
question: >-
  A data centre wants four Helio H200 solar panels. What is the total panel cost
  before mounting hardware? Use the calculator and give me the final number.
expected_answer: 5000.0
max_steps_allowed: 8

