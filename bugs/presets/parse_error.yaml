# Bug 2, MALFORMED JSON.
#
# TWO halves, and this file is only one of them:
#   * the RUNTIME half -> patient.tools.fetch_page returns slightly-broken JSON
#                         (trailing comma), switched on by bugs/inject.apply_bug()
#   * the CONFIG half  -> this file
#
# The config half is `retry_on_parse_error: false`, which matches the clean
# baseline. That is the POINT: the config already forbids recovery, so the only
# change needed to FIX this bug is flipping one boolean to true. Medic's patch
# is therefore a single-field, single-token edit.
#
# This was found by measuring, not by reading: an earlier probe reported the
# clean and "buggy" configs as differing, but a diff of the merged YAML showed
# config-differs-in: [], the two runs were identical and the result was
# meaningless. A preset that cannot be distinguished from clean by its own
# config is fine here (the runtime switch does the work) but it must never be
# reported as a config difference.
retry_on_parse_error: false
