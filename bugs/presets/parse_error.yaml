# Bug 2 — MALFORMED JSON.
#
# This bug has TWO halves and they are different in kind:
#   * the CONFIG half  -> `retry_on_parse_error: false` (this file)
#   * the RUNTIME half -> a fixture tool returning slightly-broken JSON,
#                         toggled by bugs.inject.apply_bug() via
#                         patient.tools.set_broken_json(True)
#
# The runtime half is a tool BEHAVIOUR change, not a config change, because the
# spec's bug table says so. The point of the bug is that the agent has NO way
# to recover: the tool lies, and the config forbids retrying. Medic's fix is
# the config half — flipping retry_on_parse_error to true — which is the whole
# point of the demo: the patch is one boolean, and it is the RIGHT boolean.
retry_on_parse_error: false