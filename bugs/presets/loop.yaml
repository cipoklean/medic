# Bug 3 — INFINITE LOOP.
# Two changes, both of them the kind a real agent config drifts into:
#   1. the stop rule is deleted from the system prompt
#   2. max_steps is raised, so the run has room to spin
# The hard check is "finishes within N steps WITH a final answer", so the
# fix can be either one (or both) — which is exactly the interesting case.
system_prompt: |
  You are a research agent. Answer the user's question using the available tools.

  Method:
  1. Call web_search to find candidate sources.
  2. Call fetch_page on the most relevant URL to read its actual contents.
  3. Call calculator for any arithmetic. The expression argument must be a
     plain arithmetic expression such as "128.4 * 3" or "(1200 - 340) / 2".
  4. Once you have the evidence and the computed value, stop and give a final
     answer.

  Research thoroughly: if the first sources are not conclusive, keep searching
  for more. Being thorough is more valuable than being fast.

max_steps: 40